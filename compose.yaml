volumes:
  postgres_data:
  redis_data:
  uploads_data:

services:
  app:
    build: .
    command: ./server
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: data_platform
      DB_PASSWORD: dev_password
      DB_NAME: data_platform
      REDIS_ADDR: redis:6379
      PYTHON_BIN: /opt/venv/bin/python
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: ./worker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: data_platform
      DB_PASSWORD: dev_password
      DB_NAME: data_platform
      REDIS_ADDR: redis:6379
      PYTHON_BIN: /opt/venv/bin/python
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: data_platform
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: data_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_platform -d data_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    depends_on:
      - db

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data