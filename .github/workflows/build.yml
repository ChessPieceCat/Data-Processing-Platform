name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    name: build-image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: data_platform
          POSTGRES_USER: data_platform
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_platform -d data_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r processors/dataset/requirements.txt
          pip install -r processors/image/requirements.txt

      - name: Run Go tests
        env:
          DB_SSLMODE: disable
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Python tests
        run: |
          pytest -v processors/dataset
          pytest -v processors/image
          pytest -v processors/route

      - name: Build Go applications
        run: |
          go build ./cmd/server
          go build ./cmd/worker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: data-processing-platform:ci

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::410126553529:role/data-processing-platform-github-actions
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/data-processing-platform:${{ github.sha }}

      - name: Configure AWS credentials for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::410126553529:role/data-processing-platform-github-deploy
          aws-region: us-east-2

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-2
          INSTANCE_ID: i-039ced26aad174d78
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy Data Processing Platform ${IMAGE_TAG}" \
            --parameters "$(jq -n \
              --arg tag "$IMAGE_TAG" \
              '{
                commands: [
                  "set -e",
                  "cd /home/ubuntu/Data-Processing-Platform",
                  "git fetch origin main",
                  "git reset --hard origin/main",
                  ("export IMAGE_TAG=" + $tag),
                  "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 410126553529.dkr.ecr.us-east-2.amazonaws.com",
                  "docker compose --env-file /home/ubuntu/.env.aws -f compose.aws.yaml pull app worker",
                  "docker compose --env-file /home/ubuntu/.env.aws -f compose.aws.yaml up -d --force-recreate app worker",
                  "docker compose --env-file /home/ubuntu/.env.aws -f compose.aws.yaml ps"
                ]
              }')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM command failed"
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output yaml
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml