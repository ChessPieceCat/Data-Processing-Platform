global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "application"
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_prometheus_scrape
        regex: "true"
        action: keep

      - source_labels:
          - __meta_docker_container_label_prometheus_job
        target_label: job

      - source_labels:
          - __meta_docker_network_ip
          - __meta_docker_container_label_prometheus_port
        regex: "(.+);(.+)"
        target_label: __address__
        replacement: "$1:$2"