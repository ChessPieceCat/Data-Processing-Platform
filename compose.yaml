volumes:
  postgres_data:
  redis_data:

services:
  app:
    build: .
    ports:
      - "8082:8082"
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: data_platform
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: data_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    depends_on:
      - db

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data