name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: data_platform
          POSTGRES_USER: data_platform
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_platform -d data_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r processors/dataset/requirements.txt

      - name: Run Go tests
        run: go test ./...

      - name: Run Python tests
        working-directory: processors/dataset
        run: pytest -v

      - name: Build Go server
        run: go build ./cmd/server